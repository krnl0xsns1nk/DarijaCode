<svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="20 20 145 145"
      role="img"
      aria-label="drj wordmark"
    >
      <defs>
        <linearGradient id="drj-gradient" x1="0" x2="1">
          <stop offset="0" stop-color="#0f1724" />
          <stop offset="1" stop-color="#0b6b8a" />
        </linearGradient>

        <filter
          id="drj-shadow"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
        >
          <feDropShadow
            dx="0"
            dy="4"
            std-deviation="4"
            flood-color="#000000"
            flood-opacity="0.14"
          />
        </filter>
      </defs>

      <text
        x="20"
        y="130"
        fill="url(#drj-gradient)"
        font-family="Inter, Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, Arial"
        font-weight="800"
        font-wize="136"
        letter-spacing="-10"
        filter="url(#drj-shadow)"
      >
        drj
      </text>
</svg>
