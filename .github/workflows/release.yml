name: Build and Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  # ============================================================
  # Linux, macOS and Windows
  # ============================================================

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ------------------------------------------------------
          # Linux x86_64
          # ------------------------------------------------------

          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: drj-linux-x86_64

          # ------------------------------------------------------
          # Linux ARM64
          # ------------------------------------------------------

          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: drj-linux-aarch64

          # ------------------------------------------------------
          # macOS x86_64
          # ------------------------------------------------------

          - name: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-15-intel
            binary: drj-macos-x86_64

          # ------------------------------------------------------
          # macOS ARM64
          # ------------------------------------------------------

          - name: macos-aarch64
            target: aarch64-apple-darwin
            os: macos-14
            binary: drj-macos-aarch64

          # ------------------------------------------------------
          # Windows x86_64
          # ------------------------------------------------------

          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: drj-windows-x86_64.exe

          # ------------------------------------------------------
          # Windows ARM64
          # ------------------------------------------------------

          - name: windows-aarch64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
            binary: drj-windows-aarch64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/drj.exe" \
              "release/${{ matrix.binary }}"
          else
            cp "target/${{ matrix.target }}/release/drj" \
              "release/${{ matrix.binary }}"
          fi

      - name: Verify binary
        shell: bash
        run: |
          ls -lh "release/${{ matrix.binary }}"
          file "release/${{ matrix.binary }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: release/${{ matrix.binary }}

  # ============================================================
  # Android
  # ============================================================

  build-android:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          # ------------------------------------------------------
          # Android ARM64
          # ------------------------------------------------------

          - name: android-aarch64
            target: aarch64-linux-android
            binary: drj-android-aarch64
            linker: aarch64-linux-android21-clang

          # ------------------------------------------------------
          # Android ARMv7 32-bit
          # ------------------------------------------------------

          - name: android-armv7
            target: armv7-linux-androideabi
            binary: drj-android-armv7
            linker: armv7a-linux-androideabi21-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "ndk;27.2.12479018"

      - name: Configure Android linker
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="$TOOLCHAIN/${{ matrix.linker }}"

          echo "Using Android linker:"
          echo "$LINKER"

          if [[ ! -x "$LINKER" ]]; then
            echo "ERROR: Android linker does not exist:"
            echo "$LINKER"
            echo
            echo "Available ARM Android linkers:"
            ls "$TOOLCHAIN"/armv7a-linux-androideabi*-clang 2>/dev/null || true
            ls "$TOOLCHAIN"/aarch64-linux-android*-clang 2>/dev/null || true
            exit 1
          fi

          case "${{ matrix.target }}" in
            aarch64-linux-android)
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER" >> "$GITHUB_ENV"
              ;;

            armv7-linux-androideabi)
              echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$LINKER" >> "$GITHUB_ENV"
              ;;

            *)
              echo "ERROR: Unsupported Android target:"
              echo "${{ matrix.target }}"
              exit 1
              ;;
          esac

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release

          cp "target/${{ matrix.target }}/release/drj" \
            "release/${{ matrix.binary }}"

      - name: Verify binary
        shell: bash
        run: |
          ls -lh "release/${{ matrix.binary }}"
          file "release/${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: release/${{ matrix.binary }}

  # ============================================================
  # GitHub Release
  # ============================================================

  release:
    name: Create GitHub Release
    needs:
      - build
      - build-android

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all binaries
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          echo "Release files:"
          echo

          ls -lah release

          echo
          echo "Number of release files:"
          find release -maxdepth 1 -type f | wc -l

      - name: Prepare release description
        shell: bash
        run: |
          mkdir -p .release

          NOTES="releases/${GITHUB_REF_NAME}.md"

          if [[ -f "$NOTES" ]]; then
            cp "$NOTES" .release/notes.md
          else
            cat > .release/notes.md <<EOF
          ## DarijaCode ${GITHUB_REF_NAME}

          This release contains the DarijaCode binaries for the supported platforms.

          See the documentation for installation and usage instructions.
          EOF
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: drj ${{ github.ref_name }}
          body_path: .release/notes.md
          files: release/*
          draft: false
          prerelease: false
