name: Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: drj-linux-x86_64

          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: drj-linux-aarch64

          - name: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-13
            binary: drj-macos-x86_64

          - name: macos-aarch64
            target: aarch64-apple-darwin
            os: macos-14
            binary: drj-macos-aarch64

          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: drj-windows-x86_64.exe

          - name: windows-aarch64
            target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: drj-windows-aarch64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/drj.exe" "release/${{ matrix.binary }}"
          else
            cp "target/${{ matrix.target }}/release/drj" "release/${{ matrix.binary }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: release/${{ matrix.binary }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DarijaCode ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
