name: Release

on:
  push:

permissions:
  contents: write

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: drj-linux-x86_64

          - target: aarch64-unknown-linux-gnu
            asset: drj-linux-aarch64

          - target: x86_64-pc-windows-msvc
            asset: drj-windows-x86_64.exe

          - target: aarch64-pc-windows-msvc
            asset: drj-windows-aarch64.exe

          - target: x86_64-apple-darwin
            asset: drj-macos-x86_64

          - target: aarch64-apple-darwin
            asset: drj-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/drj.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/drj" "dist/${{ matrix.asset }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
